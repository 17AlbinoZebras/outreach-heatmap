name: Build and Release

# Runs whenever you publish a release on GitHub.
# Builds the Mac (.dmg) and Windows (.exe) installers in parallel,
# then uploads both as downloadable assets on that release.
on:
  release:
    types: [published]
  workflow_dispatch:  # allows manually triggering from the Actions tab

permissions:
  contents: write  # needed to upload assets to the release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: "dist/*.dmg"
          - os: windows-latest
            artifact: "dist/*.exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Electron installer
        shell: bash
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # skip macOS code signing (no certificate on CI)

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
